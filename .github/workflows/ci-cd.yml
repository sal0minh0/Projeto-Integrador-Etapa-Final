name: Projeto Integrador - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests with Pytest and Check Coverage
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ --cov=src/ --cov-fail-under=100

    - name: Run Code Quality Checks with Pylint
      env:
        PYTHONPATH: .
      run: |
        pylint src/ tests/
